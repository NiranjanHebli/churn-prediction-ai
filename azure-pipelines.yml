trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - frontend/*

pool:
  vmImage: ubuntu-latest

variables:
  frontendFolder: 'frontend'
  buildOutputFolder: 'frontend/prod-out'
  azureServiceConnection: 'Azure-Deploy-Conn'
  appName: 'churn-prediction-ai'

stages:
# ==========================================
# STAGE 1: BUILD THE FRONTEND & INJECT SECRETS
# ==========================================
- stage: BuildStage
  displayName: 'Build Frontend'
  jobs:
  - job: BuildJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm install
        npm run build
        mkdir -p prod-out
        cp -r dist prod-out/
        cp server.js prod-out/
        cp package.json prod-out/
        cd prod-out
        npm install --omit=dev
      workingDirectory: $(frontendFolder)
      displayName: 'Build frontend and package production dependencies'
      env:
        VITE_AZURE_ML_URL: 'production'
        VITE_AZURE_ML_KEY: 'production'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(buildOutputFolder)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'
        replaceExistingArchive: true
      displayName: 'Zip dist folder'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/frontend.zip'
        ArtifactName: 'frontend-drop'
        publishLocation: 'Container'
      displayName: 'Publish frontend artifact'

# ==========================================
# STAGE 2: DEPLOY TO LINUX APP SERVICE
# ==========================================
- stage: DeployStage
  displayName: 'Deploy to Azure'
  dependsOn: BuildStage
  condition: succeeded()
  jobs:
  - job: DeployJob 
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'frontend-drop'
        downloadPath: '$(System.ArtifactsDirectory)'
      displayName: 'Download Build Artifact'

    - task: AzureWebApp@1
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        appType: 'webAppLinux' 
        appName: '$(appName)'
        package: '$(System.ArtifactsDirectory)/frontend-drop/frontend.zip'
        startUpCommand: 'node server.js'
        appSettings: '-AZURE_ML_URL "$(AZURE_ML_URL)" -AZURE_ML_KEY "$(AZURE_ML_KEY)"' 
      displayName: 'Deploy to Azure Web App'